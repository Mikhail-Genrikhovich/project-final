spring.cache.type: none
spring:
  liquibase:
    change-log: classpath:db/changelog-h2.sql
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret
          google:
            client-id: test-client-id
            client-secret: test-client-secret
          gitlab:
            client-id: test-client-id
            client-secret: test-client-secret
  mail:
    username: test@example.com
    password: test-password